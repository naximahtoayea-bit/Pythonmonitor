<!DOCTYPE html>
<html>
  <head>
    <title>Google Map - Mount Bromo Location</title>
    <meta charset="utf-8" />
    <style>
      /* ตั้งค่าให้แผนที่แสดงผลเต็มหน้าจอ */
      #map {
        height: 100vh;
        width: 100%;
      }
      body, html {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <!-- พื้นที่สำหรับแสดงแผนที่ -->
    <div id="map"></div>

    <script>
      function initMap() {
        // พิกัดของปากปล่องภูเขาไฟโบร์โม (Mount Bromo Crater)
        const bromoLocation = { lat: -7.942494, lng: 112.953012 };

        // สร้างแผนที่และตั้งค่าเริ่มต้น
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 13, // ระดับการขยาย
          center: bromoLocation, // จุดศูนย์กลางแผนที่
          mapTypeId: "hybrid", // แสดงผลแบบภาพถ่ายดาวเทียมผสมถนน
        });

        // สร้าง Marker ปักหมุด ณ จุดเกิดเหตุ/ปากปล่องภูเขาไฟ
        const marker = new google.maps.Marker({
          position: bromoLocation,
          map: map,
          title: "Mount Bromo Crater",
          animation: google.maps.Animation.DROP, // เอฟเฟกต์หมุดหยดลงมา
        });

        // สร้าง InfoWindow แสดงข้อมูลเมื่อคลิกที่ Marker
        const infoWindow = new google.maps.InfoWindow({
          content: `
            <div style="color: #333; padding: 5px;">
              <h3 style="margin: 0 0 5px 0;">🌋 Mount Bromo (ภูเขาไฟโบร์โม)</h3>
              <p style="margin: 0;"><b>พิกัด:</b> 7.9425° S, 112.9530° E</p>
              <p style="margin: 5px 0 0 0;">อุทยานแห่งชาติ Bromo Tengger Semeru, อินโดนีเซีย</p>
            </div>
          `,
        });

        // เปิด InfoWindow ทันทีเมื่อโหลด หรือเปิดเมื่อคลิก Marker
        infoWindow.open(map, marker);
        marker.addListener("click", () => {
          infoWindow.open(map, marker);
        });
      }
    </script>

    <!-- ใส่ API Key ของคุณในสคริปต์ด้านล่างนี้ -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC5l0aPyGFqiqY5DpqOYf-8YhN_eYHHobU&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
